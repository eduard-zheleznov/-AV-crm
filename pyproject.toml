[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "avito-crm-pipeline"
version = "1.12.17"
description = "Resumable Avito phone extraction and LPTracker CRM ingestion pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gspread>=6.1,<7",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "Pillow>=10.4,<12",
  "playwright>=1.50,<2",
  "pytesseract>=0.3.13,<1",
  "python-dotenv>=1.0,<2",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
avito-crm = "avito_crm.cli:main"

[project.gui-scripts]
avito-crm-gui = "avito_crm.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
avito_crm = ["certs/*.pem"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
